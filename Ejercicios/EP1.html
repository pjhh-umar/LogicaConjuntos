<div class="definicion-box">
  <h1 class="title-practica">Definición (Integral de Lebesgue de una variable aleatoria)</h1>
  
  <p>Sea $(\Omega, \mathcal{F}, \mathbb{P})$ un espacio de probabilidad y sea $X: \Omega \to \mathbb{R}$
    una variable aleatoria. Para definir la <em>integral de Lebesgue de $X$ con respecto a la medida de probabilidad $\mathbb{P}$</em>,
    primero descomponemos a $X$ en sus partes <em>positiva</em> y <em>negativa</em>, definidas respectivamente como:
  
  <ul class="two-column">
    <li>$X^+ = \max\{X, 0\}$</li>
    <li>$X^- = \max\{-X, 0\}$</li>
  </ul>
  </p>
  
  <p>De modo que $X = X^+ - X^-$ y el valor absoluto es $|X| = X^+ + X^-$. Notemos que ambas variables, $X^+$ y $X^-$, son estrictamente no negativas.</p>
  
  <p>La <strong>integral de Lebesgue de la variable aleatoria $X$ con respecto a la medida $\mathbb{P}$</strong> se define como:</p>
  
  $$ \displaystyle \int_{\Omega} X d\mathbb{P} = \displaystyle \int_{\Omega} X^+ d\mathbb{P} - \displaystyle \int_{\Omega} X^- d\mathbb{P} $$
  
  <p>Si ambas integrales del lado derecho son finitas simultáneamente, se dice que $X$ es una 
  <strong>variable aleatoria Lebesgue integrable sobre $(\Omega, \mathcal{F}, \mathbb{P})$ </strong> 
  </p>

  <p>Se denota por 
    $$\mathcal{L}^{1}(\Omega,\mathcal{F},\mathbb{P})= \left\{X:\Omega\to\mathbb{R}\text{ es una variable aleatoria }  \Big| \displaystyle \int_{\Omega} |X| d\mathbb{P}<\infty\right\}$$
     al conjunto de variables aleatorias Lebesgue integrables sobre $(\Omega, \mathcal{F}, \mathbb{P})$.
  </p>
  <p>  
  <b>Observación:</b> Dada las relaciones $X = X^+ - X^-$ y $|X| = X^+ + X^-$, 
    se tiene que $X$ es Lebesgue integrable sobre $(\Omega, \mathcal{F}, \mathbb{P})$ si y solo si $|X|$ es Lebesgue integrable 
    sobre $(\Omega, \mathcal{F}, \mathbb{P})$.
  </p>
</div> -->
